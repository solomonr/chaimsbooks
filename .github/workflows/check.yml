name: Check static site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check.py site
      - run: python scripts/build.py && python scripts/check.py dist --preview
      - run: SITE_PRODUCTION=true python scripts/build.py && python scripts/check.py dist
