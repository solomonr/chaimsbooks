[build]
  command = "python3 scripts/build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.13"

# Custom-domain launch explicitly approved by the owner on 21 October 2026.
[context.production.environment]
  SITE_PRODUCTION = "true"

[context.deploy-preview.environment]
  SITE_PRODUCTION = "false"

[context.branch-deploy.environment]
  SITE_PRODUCTION = "false"
