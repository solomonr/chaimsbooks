[build]
  command = "python3 scripts/build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.13"

# Explicitly enable only during the approved custom-domain launch:
# SITE_PRODUCTION=true
# Until then, every deployed page has noindex and the sitemap is omitted.

[context.deploy-preview.environment]
  SITE_PRODUCTION = "false"

[context.branch-deploy.environment]
  SITE_PRODUCTION = "false"
